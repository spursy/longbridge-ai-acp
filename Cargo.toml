[package]
name = "longbridge-ai-acp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Embeddable ACP bridge for Longbridge AI agents"
repository = "https://github.com/longbridge/longbridge-ai-acp"
documentation = "https://docs.rs/longbridge-ai-acp"
readme = "README.md"
keywords = ["acp", "agent", "longbridge", "ai"]
categories = ["api-bindings"]

[dependencies]
agent-client-protocol = { version = "2.0.0", features = ["unstable_auth_methods"] }
agent-client-protocol-schema = { version = "1.5.0", features = ["unstable_auth_methods"] }
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# `test-util` provides `#[tokio::test(start_paused = true)]`, which is what
# makes the backend inactivity timeout branch testable without a real minute.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
# Examples-only: the `zed_agent` example makes a real HTTP call to the
# Longbridge inner-next gateway. Kept out of the library's own dependencies so
# the published crate stays HTTP-client-free.
reqwest = { version = "0.12", features = ["json"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
